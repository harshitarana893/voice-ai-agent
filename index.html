<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Companion</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #2e1065 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 32px;
            padding: 50px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #f8fafc;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.sub-text {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 45px;
        }

        .mic-wrapper {
            position: relative;
            display: inline-block;
        }

        .mic-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            color: #ffffff;
            font-size: 42px;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(129, 140, 248, 0.5);
            transition: all 0.4s ease;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            animation: pulse-glow 2.5s infinite;
        }

        .mic-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 50px rgba(192, 132, 252, 0.8);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 25px rgba(129, 140, 248, 0.4); }
            50% { box-shadow: 0 0 45px rgba(192, 132, 252, 0.7); }
            100% { box-shadow: 0 0 25px rgba(129, 140, 248, 0.4); }
        }

        .hint-text {
            margin-top: 35px;
            font-size: 13px;
            color: #cbd5e1;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Assistant</h1>
        <p class="sub-text">Tap mic to start conversation</p>

        <div class="mic-wrapper">
            <a href="/voice" class="mic-btn">
                <i class="fa-solid fa-microphone"></i>
            </a>
        </div>

        <div class="hint-text">Touch mic to open Voice Chat</div>
    </div>

</body>
</html>
