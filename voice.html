<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #2e1065 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
        }

        .container {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            padding: 35px 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            text-align: center;
        }

        h1 {
            color: #f8fafc;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.sub-text {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 35px;
        }

        .mic-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }

        .mic-btn {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            color: #ffffff;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(129, 140, 248, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }

        .mic-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 15px 35px rgba(129, 140, 248, 0.6);
        }

        .mic-btn.listening {
            background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
            color: #ffffff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6); }
            70% { box-shadow: 0 0 0 24px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }

        .status {
            font-size: 15px;
            font-weight: 500;
            color: #cbd5e1;
            min-height: 24px;
            margin-bottom: 25px;
        }

        .chat-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 20px;
            padding: 20px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-height: 220px;
            overflow-y: auto;
        }

        .label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .user-label { color: #818cf8; }
        .ai-label { color: #38bdf8; margin-top: 16px; }

        .text-content {
            font-size: 14px;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-link:hover { color: #f8fafc; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Voice Assistant</h1>
        <p class="sub-text">Click the microphone to chat like a friend</p>

        <div class="mic-wrapper">
            <button id="micBtn" class="mic-btn">
                <i class="fa-solid fa-microphone"></i>
            </button>
        </div>

        <div id="status" class="status">Click the mic to start speaking</div>

        <div class="chat-box">
            <div class="label user-label">You Said:</div>
            <div id="userText" class="text-content">...</div>

            <div class="label ai-label">AI Response:</div>
            <div id="aiReply" class="text-content">...</div>
        </div>

        <a href="/" class="nav-link"><i class="fa-solid fa-message"></i> Switch to Text Chat</a>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const status = document.getElementById('status');
        const userTextDiv = document.getElementById('userText');
        const aiReplyDiv = document.getElementById('aiReply');

        // Check Web Speech API Support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            status.innerText = "Voice support is not available in your browser.";
        } else {
            const recognition = new SpeechRecognition();
            recognition.lang = 'gu-IN'; // Speech recognition locale
            recognition.continuous = false;
            recognition.interimResults = false;

            micBtn.addEventListener('click', () => {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                }
            });

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                status.innerText = "Listening... Speak now!";
            };

            recognition.onresult = async (event) => {
                micBtn.classList.remove('listening');
                const text = event.results[0][0].transcript;
                userTextDiv.innerText = text;
                status.innerText = "Thinking...";

                // Backend API Call (/chat)
                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text })
                    });

                    const data = await response.json();
                    const reply = data.reply;

                    aiReplyDiv.innerText = reply;
                    status.innerText = "Speaking response...";

                    // AI Voice Response (Text-to-Speech)
                    speakResponse(reply);

                } catch (err) {
                    status.innerText = "Error: Failed to get response.";
                }
            };

            recognition.onerror = (event) => {
                micBtn.classList.remove('listening');
                status.innerText = "Speech recognition error. Please try again.";
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
            };
        }

        // Multilingual Text-to-Speech Function (Auto Language Detection)
        function speakResponse(text) {
            window.speechSynthesis.cancel(); // Stop ongoing speech
            const utterance = new SpeechSynthesisUtterance(text);

            // Detect script characters to select appropriate voice accent
            if (/[\u0A80-\u0AFF]/.test(text)) {
                utterance.lang = 'gu-IN'; // Gujarati accent
            } else if (/[\u0900-\u097F]/.test(text)) {
                utterance.lang = 'hi-IN'; // Hindi accent
            } else {
                utterance.lang = 'en-US'; // English accent
            }
            
            utterance.onend = () => {
                status.innerText = "Click the mic to start speaking";
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
